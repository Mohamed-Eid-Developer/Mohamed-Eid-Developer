<svg fill="none" viewBox="0 0 800 280" width="800" height="280" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .chat-container {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background-color: #0d1117;
          color: #c9d1d9;
          padding: 20px;
          border-radius: 12px;
          border: 1px solid #30363d;
          height: 240px;
          box-sizing: border-box;
          overflow: hidden;
          position: relative;
        }
        
        .message-row {
          display: flex;
          margin-bottom: 12px;
          opacity: 0;
          position: absolute;
          animation-fill-mode: forwards;
        }

        /* رسالة الطرف الأول */
        .msg-row-1 {
          animation: showMessage 0.3s ease forwards;
          animation-delay: 0.2s;
        }
        
        /* مؤشر الكتابة للرسالة الثانية (مدة ظهوره أطول الآن: 2.2 ثانية) */
        .typing-row-2 {
          animation: showTyping 2.2s ease forwards;
          animation-delay: 2.2s;
        }
        /* الرسالة الفعلية الثانية تظهر فور اختفاء النقاط تماماً */
        .msg-row-2 {
          animation: showMessage 0.3s ease forwards;
          animation-delay: 4.4s;
        }

        /* مؤشر الكتابة للرسالة الثالثة */
        .typing-row-3 {
          animation: showTyping 2.2s ease forwards;
          animation-delay: 6.8s;
        }
        /* الرسالة الفعلية الثالثة تظهر فور اختفاء النقاط تماماً */
        .msg-row-3 {
          animation: showMessage 0.3s ease forwards;
          animation-delay: 9.0s;
        }

        .bubble {
          background-color: #161b22;
          border: 1px solid #30363d;
          padding: 10px 16px;
          border-radius: 12px;
          font-size: 14px;
          line-height: 1.4;
          color: #e6edf3;
        }

        /* تخصيص فقاعات رسائل محمد عيد */
        .mohamed-bubble {
          background-color: #1f6feb22;
          border-color: #1f6feb55;
          color: #58a6ff;
        }

        /* تصميم نقاط الكتابة المتحركة */
        .typing-indicator {
          display: flex;
          align-items: center;
          gap: 4px;
          padding: 12px 16px;
          background-color: #161b22;
          border: 1px solid #30363d;
          border-radius: 12px;
          width: fit-content;
        }

        .typing-dot {
          width: 7px;
          height: 7px;
          background-color: #8b949e;
          border-radius: 50%;
          animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        .typing-dot:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
          0%, 80%, 100% { transform: scale(0); }
          40% { transform: scale(1.0); }
        }

        /* هنا جعلنا حركة النقاط تستغرق وقتاً أطول وثابتة بنسبة كبيرة */
        @keyframes showTyping {
          0% { opacity: 0; transform: translateY(10px); }
          15% { opacity: 1; transform: translateY(0); }
          85% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(-5px); }
        }

        @keyframes showMessage {
          0% { opacity: 0; transform: translateY(10px); }
          100% { opacity: 1; transform: translateY(0); }
        }
      </style>

      <div class="chat-container">
        
        <!-- الرسالة الأولى -->
        <div class="message-row msg-row-1" style="top: 20px;">
          <div class="bubble">
            Hi Mohamed! Tell me a bit about yourself. 👋
          </div>
        </div>

        <!-- مؤشر الكتابة للرسالة الثانية -->
        <div class="message-row typing-row-2" style="top: 75px;">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
        <!-- الرسالة الفعلية الثانية -->
        <div class="message-row msg-row-2" style="top: 75px;">
          <div class="bubble mohamed-bubble">
            Hello! I'm Mohamed Eid, a Data Engineer 📊
          </div>
        </div>

        <!-- مؤشر الكتابة للرسالة الثالثة -->
        <div class="message-row typing-row-3" style="top: 145px;">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>

        <!-- الرسالة الفعلية الثالثة -->
        <div class="message-row msg-row-3" style="top: 145px;">
          <div class="bubble mohamed-bubble">
            I build robust data pipelines and handle big data architectures! 
          </div>
        </div>

      </div>
    </div>
  </foreignObject>
</svg>
