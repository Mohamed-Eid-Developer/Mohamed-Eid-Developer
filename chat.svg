<svg
  width="900"
  height="470"
  viewBox="0 0 900 470"
  xmlns="http://www.w3.org/2000/svg"
>

  <!--
    Mohamed Eid - Animated GitHub Introduction
    Inspired by a chat-style GitHub profile layout
  -->

  <style>
    .title {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 22px;
      font-weight: 700;
      fill: #f0f6fc;
    }

    .message {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      font-weight: 600;
      fill: #f0f6fc;
    }

    .message-small {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #f0f6fc;
    }

    .link {
      fill: #58a6ff;
    }

    .bubble {
      fill: #c7ccd1;
    }

    .bubble-dark {
      fill: #b8bec4;
    }

    .show-1 {
      animation: showMessage 0.6s ease-out 0.8s forwards;
    }

    .show-2 {
      animation: showMessage 0.6s ease-out 2.2s forwards;
    }

    .show-3 {
      animation: showMessage 0.6s ease-out 3.8s forwards;
    }

    .show-4 {
      animation: showMessage 0.6s ease-out 5.4s forwards;
    }

    .show-5 {
      animation: showMessage 0.6s ease-out 7.0s forwards;
    }

    .show-6 {
      animation: showMessage 0.6s ease-out 8.6s forwards;
    }

    .show-7 {
      animation: showMessage 0.6s ease-out 10.2s forwards;
    }

    @keyframes showMessage {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>


  <!-- ========================= -->
  <!-- TITLE -->
  <!-- ========================= -->

  <text
    x="28"
    y="35"
    class="title"
  >
    Hi there 👋
  </text>


  <!-- ========================= -->
  <!-- MESSAGE 1 -->
  <!-- ========================= -->

  <g
    class="show-1"
    opacity="0"
  >

    <rect
      x="38"
      y="60"
      width="230"
      height="55"
      rx="18"
      class="bubble"
    />

    <text
      x="58"
      y="94"
      class="message"
    >
      Hi, I'm Mohamed 👋
    </text>

  </g>


  <!-- ========================= -->
  <!-- MESSAGE 2 -->
  <!-- ========================= -->

  <g
    class="show-2"
    opacity="0"
  >

    <rect
      x="38"
      y="127"
      width="555"
      height="65"
      rx="18"
      class="bubble-dark"
    />

    <text
      x="58"
      y="155"
      class="message"
    >
      4th-year MIS student at Alexandria University
    </text>

    <text
      x="58"
      y="178"
      class="message-small"
    >
      🎓 Faculty of Business
    </text>

  </g>


  <!-- ========================= -->
  <!-- MESSAGE 3 -->
  <!-- ========================= -->

  <g
    class="show-3"
    opacity="0"
  >

    <rect
      x="38"
      y="204"
      width="610"
      height="65"
      rx="18"
      class="bubble"
    />

    <text
      x="58"
      y="232"
      class="message"
    >
      Currently learning Data Analysis 📊
    </text>

    <text
      x="58"
      y="255"
      class="message-small"
    >
      Building my foundation toward Data Engineering 🚀
    </text>

  </g>


  <!-- ========================= -->
  <!-- MESSAGE 4 -->
  <!-- ========================= -->

  <g
    class="show-4"
    opacity="0"
  >

    <rect
      x="38"
      y="281"
      width="490"
      height="55"
      rx="18"
      class="bubble-dark"
    />

    <text
      x="58"
      y="315"
      class="message"
    >
      Experienced with Python and Java 💻
    </text>

  </g>


  <!-- ========================= -->
  <!-- MESSAGE 5 -->
  <!-- ========================= -->

  <g
    class="show-5"
    opacity="0"
  >

    <rect
      x="38"
      y="348"
      width="470"
      height="55"
      rx="18"
      class="bubble"
    />

    <text
      x="58"
      y="382"
      class="message"
    >
      Working with SQL Server 🗄️
    </text>

  </g>


  <!-- ========================= -->
  <!-- MESSAGE 6 -->
  <!-- ========================= -->

  <g
    class="show-6"
    opacity="0"
  >
       <rect
      x="38"
      y="415"
      width="555"
      height="55"
      rx="18"
      class="bubble-dark"
    />

    <text
      x="58"
      y="449"
      class="message"
    >
      Git &amp; GitHub • Docker • Power BI 🚀
    </text>

  </g>


  <!-- ========================= -->
  <!-- LOOP -->
  <!-- ========================= -->

  <rect
    x="0"
    y="0"
    width="1"
    height="1"
    opacity="0"
  >
    <animate
      attributeName="opacity"
      values="0;1;0"
      dur="13s"
      repeatCount="indefinite"
    />
  </rect>

</svg>
